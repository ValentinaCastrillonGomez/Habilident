<div class="border border-solid border-collapse">
    <div class="flex">
        @for (field of header.controls; track field; let columnIndex = $index) {
        <div class="flex-1 min-w-0 px-1" [ngClass]="inputTypes.LABEL === field.controls.type.value ? 'bg-sky-100': ''">
            <app-field [field]="field" [rowType]="row.controls.type.value" [isDelete]=" header.controls.length > 2"
                (remove)="removeColumn(columnIndex)"></app-field>
        </div>
        }
        <div class="flex flex-col self-center">
            <button mat-icon-button type="button" matTooltip="Agregar columna" (click)="addColumn()">
                <mat-icon>add_column_right</mat-icon>
            </button>
            <button mat-icon-button type="button" matTooltip="Agregar fila" (click)="addRow()">
                <mat-icon>add_row_below</mat-icon>
            </button>
        </div>
    </div>
    @for (rowInputs of row.controls.fields.controls.slice(1); track rowInputs; let rowIndex = $index) {
    <div class="flex">
        @for (field of rowInputs.controls; track field; let columnIndex = $index) {
        <div class="flex-1 min-w-0 px-1" [ngClass]="inputTypes.LABEL === field.controls.type.value ? 'bg-sky-100': ''">
            <app-field [field]="field" [rowType]="row.controls.type.value"></app-field>
        </div>
        }
        <button mat-icon-button type="button" matTooltip="Eliminar fila"
            [ngClass]="row.controls.fields.controls.length > 2 ? 'visible' : 'invisible'"
            class="text-red-600 self-center" (click)="removeRow(rowIndex + 1)">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    }
</div>
